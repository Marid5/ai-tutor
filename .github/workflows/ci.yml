name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/validate_content.py
      - run: python scripts/check_release_version.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # SHOTS=1 also renders the README screenshots, uploaded for review below.
      - run: make e2e
        env:
          SHOTS: "1"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/

  docker:
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the environment
        run: |
          cp .env.example .env
          mkdir -p data
          sudo chown 10001:10001 data
      - name: Build the image
        run: docker compose build
      - name: Start the app
        run: docker compose up -d
      - name: Wait for the health check
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then exit 0; fi
            sleep 1
          done
          docker compose logs --tail 50 app
          exit 1
      - name: The build identifier reaches the running app
        run: |
          cat health.json
          grep -Eq "\"git_sha\": ?\"${GIT_SHA}\"" health.json
      - name: The port is published on loopback only
        run: |
          published="$(docker compose port app 8000)"
          echo "Published on: $published"
          case "$published" in
            127.0.0.1:*) ;;
            *) echo "App port must be bound to 127.0.0.1, got: $published"; exit 1 ;;
          esac
      - name: Stop
        if: always()
        run: docker compose down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
